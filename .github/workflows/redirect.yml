# Publishes github-pages/ so the old address (lpicci96.github.io/LucaPicci, and any path under it)
# redirects to lucapicci.com. The site itself deploys from Cloudflare. Run by hand from the Actions tab.
name: Redirect GitHub Pages to lucapicci.com

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload redirect pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: './github-pages'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
